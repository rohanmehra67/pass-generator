<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password Generator</title>
    <style>
        body{
            background-color: black;
            text-align: center;
        }
        .container{
            color: white;
            border: 2px solid white;
            padding: 5em;
        }
        .check:hover{
            cursor: pointer;
            opacity: 0.9;
        }
        #textbox{
            background-color: rgb(200, 146, 200);
            text-align: center;
            border-radius: 5px;
            color: rgba(0, 0, 0, 0.4);
            margin: 10px;
            padding: 4px 10px;
        }
        button{
            border-radius: 5px;
            color: black;
            cursor: pointer;
            background-color: yellow;
            width: 200px;
            height: 22px;
        }
        button:hover{
            opacity: 0.8;
            width: 201px;
            height: 23px;
        }
        #passLength{
            background-color: lightblue;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <form action="">
            <label for="textbox">Your Password</label><br><br>
            <!-- <input id="textbox" type="" placeholder="your password"><br><br> -->
             <!-- <span id="textbox"></span>
               -->
            <span id="textbox">your password</span><br><br>
            <label class="check" for="passLength">Length: <span id="passValue">25</span></label><br>
            <input type="range" min="10" max="40" value="25" class="check" id="passLength" name="option"> <br>
            <input type="checkbox" class="check" id="lowerCase" name="option"><label class="check" for="lowerCase">include lowercase characters</label><br>
            <input type="checkbox" class="check" id="upperCase" name="option"><label class="check" for="upperCase">include uppercase characters</label><br>
            <input type="checkbox" class="check" id="symbols" name="option"><label class="check" for="symbols">include special symbols</label><br>
            <input type="checkbox" class="check" id="numbers" name="option"><label class="check" for="numbers">include numbers</label><br>
            <br>
            
        </form>
        <span style="color: red;" id="alertText"></span><br>
        <button type="button">Generate Password</button>
    <script src="password.js"></script>
    </div>
</body>
</html>
